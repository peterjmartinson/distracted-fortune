name: Fetch Discussion Counts

on:
  workflow_dispatch:
  push:
    paths:
      - '_posts/**'
      - '.github/workflows/fetch_discussion_counts.yml'

jobs:
  fetch-counts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci || true

      - name: Fetch discussion counts
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: peterjmartinson/distracted-fortune
        run: |
          node scripts/fetch_discussion_counts.js

      - name: Commit counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/discussion_counts.yml || true
          git commit -m "chore: update discussion counts" || true
          git push || true
