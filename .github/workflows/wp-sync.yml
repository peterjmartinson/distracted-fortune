name: WP Sync (create drafts on PR, publish on merge)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  wp-sync:
    runs-on: ubuntu-latest
    needs: test
    if: >
      (
        github.event_name == 'pull_request'
        && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Fetch JWT token
        id: jwt
        run: |
          set -euo pipefail

          # exit early if secrets are missing
          if [ -z "${{ secrets.BOT_USERNAME }}" ] || [ -z "${{ secrets.BOT_PASSWORD }}" ]; then
            echo "::error::BOT_USERNAME or BOT_PASSWORD is missing. If this is a forked PR, secrets are not available to pull_request workflows."
            exit 1
          fi

          # capture response body and http status
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "https://distractedfortune.com/wp-json/jwt-auth/v1/token" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${{ secrets.BOT_USERNAME }}\",\"password\":\"${{ secrets.BOT_PASSWORD }}\"}")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          # surface HTTP errors
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::JWT endpoint returned HTTP $HTTP_STATUS. Response body: $BODY"
            exit 1
          fi

          # make sure we have JSON before calling jq
          if ! echo "$BODY" | jq -e . >/dev/null 2>&1; then
            echo "::error::JWT endpoint returned non-JSON response. Body: $BODY"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::JWT token missing in response. Body: $BODY"
            exit 1
          fi

          # export token safely
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run WP sync (create/update draft)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ steps.jwt.outputs.token }}   # fresh JWT each run
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node src/index.js pr
