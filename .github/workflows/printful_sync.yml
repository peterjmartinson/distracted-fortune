name: Sync Printful Mugs Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sync-mugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Sync Printful Mugs
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_URL: "https://distractedfortune.printful.me"
        run: |
          node scripts/sync_printful_mugs.js

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/mugs.yml || true
          git commit -m "chore: sync Printful mugs catalog" || true
          git push || true
