    caption: "Jean-François Millet’s The Sower (1850) depicts the rhythmic, persistent labor of casting seeds into the earth—a fitting metaphor for the daily discipline of building a network."
    alt: "A classical oil painting of a lone peasant worker in a dark hat and blue tunic, striding across a dark, tilled field and scattering seeds with a broad sweep of his arm under a dusky sky."
