  - file: front_image.jpg
    caption: "Albrecht Dürer’s 1514 engraving Melencolia I, depicting the paralysis of creativity and the heavy burden of thought."
    alt: "A winged personification of Melancholy sits dejectedly surrounded by tools of geometry, architecture, and alchemy, including a magic square and a polyhedral stone."
