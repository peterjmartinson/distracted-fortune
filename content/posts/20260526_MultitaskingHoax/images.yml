images:
  - file: front_image.jpg
    caption: "Melencolia I is a large 1514 engraving by the German Renaissance artist Albrecht Dürer. Its central subject is an enigmatic and gloomy winged female figure thought to be a personification of melancholia. Holding her head in her hand, she stares past the busy scene in front of her."
    alt: "Melencolia I is a large 1514 engraving by the German Renaissance artist Albrecht Dürer. Its central subject is an enigmatic and gloomy winged female figure thought to be a personification of melancholia. Holding her head in her hand, she stares past the busy scene in front of her."
    credit: "By Albrecht Dürer - https://artsandculture.google.com/asset/melencolia-i/_AGDdr3EHmNGyA, Public Domain, https://commons.wikimedia.org/w/index.php?curid=29675382"
